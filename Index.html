<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Hospital Plantitas Verdes</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg mi-nav shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand text-success fw-bold" href="#">Hospital Plantitas Verdes</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="#pacientes">Pacientes</a>
                <a class="nav-link" href="#empleados">Empleados</a>
                <a class="nav-link" href="#turnos">Turnos</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="text-center mb-5 mi-titulo">
            <h1>Hospital Plantitas Verdes</h1>
            <p>Cuidando de tu salud de manera natural</p>
        </header>

        <section id="pacientes" class="caja p-4 rounded mb-5">
            <h2 class="h3 mb-3">Registrar Paciente</h2>
            <form>
                <div class="mb-3">
                    <label for="nom_paci" class="form-label">Nombre:</label>
                    <input type="text" id="nom_paci" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="apell_paci" class="form-label">Apellido:</label>
                    <input type="text" id="apell_paci" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="fec_naci_paci" class="form-label">Fecha de nacimiento:</label>
                    <input type="date" id="fec_naci_paci" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="dni_paci" class="form-label">DNI:</label>
                    <input type="number" id="dni_paci" class="form-control">
                </div>

                <button type="submit" class="btn btn-verde">Registrar Paciente</button>
            </form>
        </section>

        <section id="empleados" class="caja p-4 rounded mb-5">
            <h2 class="h3 mb-3">Registro de Empleados</h2>
            <form>
                <div class="mb-3">
                    <label for="emp_nombre" class="form-label">Nombre del empleado:</label>
                    <input type="text" id="emp_nombre" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="emp_apellido" class="form-label">Apellido del empleado:</label>
                    <input type="text" id="emp_apellido" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="emp_especialidad" class="form-label">Especialidad / Área:</label>
                    <select id="emp_especialidad" class="form-select">
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="Administracion">Administración</option>
                        <option value="Clinica Medica">Clínica Médica</option>
                        <option value="Pediatria">Pediatría</option>
                        <option value="Cardiologia">Cardiología</option>
                        <option value="Dermatologia">Dermatología</option>
                        <option value="Traumatologia">Traumatología</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="emp_codigo" class="form-label">Contraseña:</label>
                    <input type="password" id="emp_codigo" class="form-control">
                </div>

                <button type="submit" class="btn btn-verde">Registrar Empleado</button>
            </form>
        </section>

        <section id="turnos" class="caja p-4 rounded mb-5">
            <h2 class="h3 mb-3">Agendar Turno</h2>
            <form>
                <div class="mb-3">
                    <label for="T_paciente" class="form-label">DNI del Paciente:</label>
                    <input type="number" id="T_paciente" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="T_edad" class="form-label">Edad:</label>
                    <input type="number" id="T_edad" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="T_especialidad" class="form-label">Especialidad solicitada:</label>
                    <select id="T_especialidad" class="form-select">
                        <option value="" selected disabled>Seleccione una especialidad</option>
                        <option value="Clinica Medica">Clínica Médica</option>
                        <option value="Pediatria">Pediatría</option>
                        <option value="Cardiologia">Cardiología</option>
                        <option value="Dermatologia">Dermatología</option>
                        <option value="Traumatologia">Traumatología</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="T_fecha" class="form-label">Fecha del turno:</label>
                    <input type="date" id="T_fecha" class="form-control">
                </div>

                <button type="submit" class="btn btn-verde">Agendar Turno</button>
            </form>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sistema.js"></script>
</body>
</html>
